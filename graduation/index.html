<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Voice Conversation</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>

  <style>
    /* === 스타일 그대로 유지 === */
    :root {
      --primary: #f97316; --primary-dark: #ea580c;
      --success: #10b981; --error: #ef4444;
      --bg1: #fff7ed; --bg2: #ffedd5; --bg3: #fed7aa;
      --text: #1e1e1e; --muted: #4b5563;
      --border: rgba(0,0,0,0.12); --glass: rgba(255,255,255,0.4);
      --glass-border: rgba(0,0,0,0.15);
    }
    * { box-sizing: border-box; margin: 0; padding: 0 }
    body {
      font-family: 'Inter', sans-serif;
      color: var(--text);
      background: linear-gradient(135deg, var(--bg1), var(--bg2));
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .card {
      width: 95%; max-width: 640px;
      background: var(--glass); backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 24px; padding: 28px;
      box-shadow: 0 10px 40px rgba(0,0,0,.15);
    }
    .title { font-size: 2rem; font-weight: 800; color: var(--primary); margin-bottom: .3rem; }
    .subtitle { color: var(--muted); margin-bottom: 1rem; }
    .mic {
      display: flex; align-items: center; justify-content: center;
      width: 110px; height: 110px; border-radius: 50%;
      border: none; cursor: pointer; margin: 14px auto 8px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      box-shadow: 0 14px 36px rgba(249, 115, 22, 0.35);
      transition: transform .15s ease, box-shadow .2s ease;
    }
    .mic.rec { background: linear-gradient(135deg, #ef4444, #dc2626); animation: pulse 1.8s infinite; }
    @keyframes pulse {
      0%,100%{ box-shadow: 0 8px 28px rgba(239,68,68,.35) }
      50%{ box-shadow: 0 8px 28px rgba(239,68,68,.6),0 0 0 12px rgba(239,68,68,.1),0 0 0 22px rgba(239,68,68,.05)}
    }
    .status { text-align: center; color: var(--muted); margin-bottom: 12px; }
    .panel { background: var(--bg3); border-radius: 16px; padding: 14px 16px; margin: 8px 0; }
    .panel h4 { font-size: 1rem; color: #7c2d12; margin-bottom: .5rem; }
    .text { font-size: 1.02rem; line-height: 1.5; white-space: pre-wrap; }
    .result { margin-top: 12px; padding: 10px; border-radius: 10px; font-weight: 600; display: none; }
    .ok { color: var(--success); background: rgba(16,185,129,.12); }
    .err { color: var(--error); background: rgba(239,68,68,.12); }
    .audio { width: 100%; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="title">반려 로봇 음성 대화 시스템</div>
    <div class="subtitle">🎙 Whisper 전사 + 감정 분석 → Gemini 요약 → TTS 출력</div>

    <button id="btn" class="mic"><span class="mi"><h3>mike</h3></span></button>
    <div id="status" class="status">마이크 버튼을 눌러 녹음을 시작하세요</div>

    <div class="panel">
      <h4>🎧 대화 전사 결과</h4>
      <div id="ko" class="text">-</div>
    </div>

    <div class="panel">
      <h4>😊 감정 분석 결과</h4>
      <div id="emotion" class="text">-</div>
    </div>

    <div class="panel">
      <h4>🤖 Gemini 응답</h4>
      <div id="summary" class="text">-</div>
    </div>

    <audio id="player" class="audio" controls style="display:none"></audio>
    <div id="msg" class="result"></div>
  </div>

  <script>
    const API_BASE = "http://34.64.153.210:5022"; // 🟠 본인 서버 주소 -> ngrok 주소(무료버전은 8시간마다 변경되므로 수정필요.)
    //const API_BASE = "https://bihourly-yelena-undeformed.ngrok-free.dev";
    //const API_BASE = "http://127.0.0.1:5022";

    const btn = document.getElementById('btn');
    const statusEl = document.getElementById('status');
    const koEl = document.getElementById('ko');
    const emotionEl = document.getElementById('emotion');
    const summaryEl = document.getElementById('summary');
    const msgEl = document.getElementById('msg');
    const player = document.getElementById('player');

    let isRec = false, mediaRecorder = null, chunks = [];

    function showMsg(text, ok = true) {
      msgEl.textContent = text;
      msgEl.className = 'result ' + (ok ? 'ok' : 'err');
      msgEl.style.display = 'block';
    }
    function clearMsg() { msgEl.style.display = 'none'; }

    // 🎙 녹음 버튼 클릭
    btn.addEventListener('click', async () => {
      if (!isRec) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
          chunks = [];
          mediaRecorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
          mediaRecorder.onstop = onStop;
          mediaRecorder.start();
          isRec = true;
          btn.classList.add('rec');
          btn.disabled = false;
          statusEl.textContent = '🎙 녹음 중... (다시 누르면 종료)';
          clearMsg();
        } catch {
          showMsg('❌ 마이크 접근 실패. 권한을 확인하세요.', false);
        }
      } else {
        mediaRecorder && mediaRecorder.stop();
        isRec = false;
        btn.classList.remove('rec');
      }
    });

    // 🎧 녹음 종료 → 서버 업로드
    async function onStop() {
      btn.disabled = true;
      statusEl.textContent = '🌀 서버 처리 중... 잠시만 기다려주세요.';

      const blob = new Blob(chunks, { type: 'audio/webm' });
      const form = new FormData();
      form.append('audio', blob, `mic-${Date.now()}.webm`);

      try {
        const resp = await fetch(`${API_BASE}/upload_audio`, { method: 'POST', body: form });
        const result = await resp.json();

        if (!resp.ok || !result.success) {
          showMsg(result.message || '서버 오류 발생', false);
          btn.disabled = false;
          statusEl.textContent = '다시 시도하세요.';
          return;
        }

        const { asr_text_ko, emotion, ai_response, audio_url } = result.data;
        koEl.textContent = asr_text_ko || '-';
        emotionEl.textContent = emotion || '-';
        summaryEl.innerHTML = ai_response || '-';

        if (audio_url) {
          player.src = `${API_BASE}${audio_url}`;
          player.style.display = 'block';
          player.play().catch(()=>{});
        }

        showMsg('✅ 전사 + 감정 분석 + 요약 완료!', true);
        statusEl.textContent = '마이크 버튼을 눌러 다시 녹음하세요.';
      } catch (e) {
        console.error(e);
        showMsg('🌐 네트워크 오류: 서버 연결 실패', false);
        statusEl.textContent = '다시 시도하세요.';
      } finally {
        btn.disabled = false;
      }
    }

    // 스페이스바로 녹음 토글
    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space') { e.preventDefault(); btn.click(); }
    });
  </script>
</body>
</html>
